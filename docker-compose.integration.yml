name: telegram-account-bot-integration

services:
  integration-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bot_integration
      POSTGRES_USER: integration
      POSTGRES_PASSWORD: integration
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integration -d bot_integration"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data

  integration-tests:
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgres://integration:integration@integration-db:5432/bot_integration
    depends_on:
      integration-db:
        condition: service_healthy
